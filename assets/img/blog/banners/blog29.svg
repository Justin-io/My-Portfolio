  <text x="1120" y="50" fill="#00f2ff" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" text-anchor="end">LAB REF: 2026-B29</text>

  <!-- Category Badge -->
  <rect x="80" y="100" width="190" height="34" rx="17" fill="rgba(255,255,255,0.03)" stroke="#00f2ff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="98" cy="117" r="4" fill="#00f2ff"/>
  <text x="112" y="122" fill="#00f2ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="1.5">QUANTUM PHYSICS</text>

  <!-- Main Title -->
  <text x="80" y="240" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="42" font-weight="bold" letter-spacing="-0.5">CHSH Bell Inequality Polarimeter Tests</text>
  <text x="80" y="295" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="bold" opacity="0.9"></text>

  <!-- Subtitle -->
  <text x="80" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="22" font-weight="400">Experimental Verification of Quantum Non-Locality (S = 2.828)</text>

  <!-- Bottom Visual Accent Box -->
  <rect x="80" y="460" width="1040" height="110" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="110" y="500" fill="#00f2ff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">KEY DOMAIN // SYSTEM VERIFIED</text>
  <text x="110" y="535" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="16">Architecture, Empirical Benchmarks &amp; Formal Implementations</text>
  
  <!-- Glowing Corner Bracket -->
  <path d="M 1090 490 L 1090 480 L 1080 480" stroke="#00f2ff" stroke-width="2" fill="none"/>
  <path d="M 1090 530 L 1090 540 L 1080 540" stroke="#00f2ff" stroke-width="2" fill="none"/>
  <circle cx="1060" cy="515" r="6" fill="#3b82f6"/>
  <circle cx="1040" cy="515" r="4" fill="#00f2ff" opacity="0.6"/>
  <circle cx="1025" cy="515" r="3" fill="#ffffff" opacity="0.4"/>
