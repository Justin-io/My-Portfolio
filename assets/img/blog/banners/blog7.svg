<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c24"/>
      <stop offset="50%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#02040d"/>
    </linearGradient>
    <linearGradient id="acc_7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow_7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg_7)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  
  <!-- Ambient Neon Orbs -->
  <circle cx="1050" cy="150" r="260" fill="#38bdf8" opacity="0.10" filter="url(#glow_7)"/>
  <circle cx="150" cy="520" r="220" fill="#818cf8" opacity="0.08" filter="url(#glow_7)"/>

  <!-- Top Cyber Telemetry Line -->
  <line x1="80" y1="60" x2="1120" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">RESEARCH PAPER // HARINANDAN K // DEC 18, 2024</text>
  <text x="1120" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" text-anchor="end">LAB REF: 2026-B07</text>

  <!-- Category Badge -->
  <rect x="80" y="100" width="230" height="34" rx="17" fill="rgba(255,255,255,0.03)" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
  <circle cx="98" cy="117" r="4" fill="#38bdf8"/>
  <text x="112" y="122" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="1.5">THEORETICAL PHYSICS</text>

  <!-- Main Title -->
  <text x="80" y="240" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="42" font-weight="bold" letter-spacing="-0.5">The Simulation Hypothesis: Physical Limits</text>
  <text x="80" y="295" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="bold" opacity="0.9"></text>

  <!-- Subtitle -->
  <text x="80" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="22" font-weight="400">Computational Bounds, Planck Discreteness &amp; Information Theory</text>

  <!-- Bottom Visual Accent Box -->
  <rect x="80" y="460" width="1040" height="110" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="110" y="500" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">KEY DOMAIN // SYSTEM VERIFIED</text>
  <text x="110" y="535" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="16">Architecture, Empirical Benchmarks &amp; Formal Implementations</text>
  
  <!-- Glowing Corner Bracket -->
  <path d="M 1090 490 L 1090 480 L 1080 480" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 1090 530 L 1090 540 L 1080 540" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <circle cx="1060" cy="515" r="6" fill="#818cf8"/>
  <circle cx="1040" cy="515" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1025" cy="515" r="3" fill="#ffffff" opacity="0.4"/>
</svg>